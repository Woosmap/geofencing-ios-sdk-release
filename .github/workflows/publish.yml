name: publish Geofencing SDK on https://cocoapods.org/
on:
  repository_dispatch:
    types: [pods]
jobs:
  myEvent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.ref }}
      - run: echo ${{ github.event.client_payload.sha }}

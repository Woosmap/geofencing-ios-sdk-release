name: publish Geofencing SDK on https://cocoapods.org/
on:
  repository_dispatch:
    types: [pods]

permissions:
  contents: write

jobs:

  pre-publish:
    runs-on: ubuntu-latest
    steps:

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: Woosmap
          repositories: |
            geofencing-ios-sdk-release
            geofencing-enterprise-ios-sdk

      - name: Download artifact zip
        run: |
          curl -L -H "Authorization: token ${{ secrets.WOOSMAP_GITHUB_TOKEN }}" \
            -o $RUNNER_TEMP/artifact.zip \
            https://api.github.com/repos/Woosmap/geofencing-enterprise-ios-sdk/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip

          curl -L -H "Authorization: token ${{ secrets.WOOSMAP_GITHUB_TOKEN }}" \
              -o $RUNNER_TEMP/sdk.zip \
              https://api.github.com/repos/Woosmap/geofencing-enterprise-ios-sdk/actions/artifacts/${{ github.event.client_payload.sdk_artifact_id }}/zip

      - name: Unzip artifact
        run: |
          unzip $RUNNER_TEMP/artifact.zip -d $RUNNER_TEMP/artifact
          unzip $RUNNER_TEMP/sdk.zip -d $RUNNER_TEMP/artifact/sdk
  
          
      - name: Checkout default branch (dynamic)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: update latest version of SDK
        run: |
          cp -Rf $RUNNER_TEMP/artifact/sdk/* WoosmapGeofencing.xcframework/
          sed -i "3 s/.*/  s.version = '${VERSION}'/" WoosmapGeofencing.podspec || exit 1
        env:
          VERSION: ${{ github.event.client_payload.v }}


      - name: update Change Log
        run: |
          touch update.md
          echo "## ${VERSION}" > update.md
          cat  $RUNNER_TEMP/artifact/WHATSNEW.md >> update.md
          echo "" >> update.md
          cat  CHANGELOG.md >> update.md
          rm CHANGELOG.md
          mv update.md CHANGELOG.md
        env:
          VERSION: ${{ github.event.client_payload.v }}

      - name: Check if branch is dirty
        id: branchstatus
        run: |
            _isbranchUpdated=false
            if [[ -n $(git status --porcelain) ]]; then
              _isbranchUpdated=true
            fi
            echo "update=${_isbranchUpdated}" >> "$GITHUB_OUTPUT"
          
      - name: Commit and push changes
        if: ${{ steps.branchstatus.outputs.update == 'true' }}
        run: |
          git config user.name  "release-bot[bot]"
          git config user.email "release-bot[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[AUTO] Updated ${VERSION}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
        env:
          VERSION: ${{ github.event.client_payload.v }}
      
      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${VERSION}
          git push origin ${VERSION}
        env:
          VERSION: ${{ github.event.client_payload.v }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.v }}
          body_path: ${{ runner.temp }}/artifact/WHATSNEW.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cocoa-pod:
    runs-on: macos-14
    needs: pre-publish
    steps:
      
      - name: Set up Ruby and CocoaPods
        run: |
          sudo gem install cocoapods
      
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Lint podspec
        run: |
          pod lib lint WoosmapGeofencing.podspec --allow-warnings
      

      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          mkdir -p ~/.cocoapods
          mkdir -p ~/.cocoapods/trunk
          cat <<EOF > ~/.cocoapods/trunk/config.json
          {
            "trunk_token": "${COCOAPODS_TRUNK_TOKEN}"
          }
          EOF
          pod trunk me
          pod trunk push WoosmapGeofencing.podspec --allow-warnings
      

      - name: cleanup
        if: ${{ always() }}
        run: |
            rm -rf ~/.cocoapods
      



      
